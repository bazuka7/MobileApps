name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VozComida.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VozComida-apk
          path: VozComida.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: VozComida (APK más reciente)
          files: VozComida.apk
          make_latest: true
